<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recipe to FairPrice Cart</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; font-size: 13px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    button { width: 100%; padding: 6px; margin-bottom: 8px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0 0 8px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; }
    li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button { width: auto; margin: 0; padding: 2px 6px; }
    #status { color: #555; margin-bottom: 8px; }
    #result { max-height: 310px; overflow-y: auto; }
    .item { padding: 7px 0; border-bottom: 1px solid #f2f2f2; }
    .item-head { display: flex; justify-content: space-between; gap: 8px; }
    .item-name { font-weight: 600; }
    .item-quantity { color: #555; white-space: nowrap; }
    .chosen-product { display: block; margin-top: 4px; line-height: 1.25; }
    .chosen-meta { color: #555; display: block; font-size: 11px; margin-top: 2px; }
    .searching { color: #777; display: block; font-size: 11px; margin-top: 4px; }
    #addAll { margin: 10px 0 0; }
    .flag { color: #b00; }
  </style>
</head>
<body>
  <h1>Recipe to FairPrice Cart</h1>
  <button id="addPage">Add this page as a recipe</button>
  <ul id="recipeList"></ul>
  <button id="buildList">Build shopping list</button>
  <div id="status"></div>
  <div id="result"></div>
  <button id="addAll" hidden disabled>Add to FairPrice Cart</button>
  <script src="popup.js"></script>
</body>
</html>
